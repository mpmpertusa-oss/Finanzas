<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#F3F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1015" media="(prefers-color-scheme: dark)">
<meta name="description" content="Finanzas personales y en pareja: gastos, gastos fijos, inversiones y facturas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F3F6; --card:#FFFFFF; --ink:#17181F; --muted:#5C5E6B; --line:#EEEEF2; --chip:#E6E6EC; --track:#F0F0F4;
  --accent:#4B3BC9; --accent-btn:#4B3BC9; --accent-soft:#ECEBF8;
  --good:#1B6E45; --good-soft:#E8F4EE;
  --warn:#8A4B00; --warn-strong:#5E3300; --warn-soft:#FFF4E2; --warn-bar:#D98A1E;
  --neutral-bar:#B9BAC6; --bad:#B42318; --shadow:0 1px 2px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1015; --card:#1A1B22; --ink:#F2F2F5; --muted:#A3A5B3; --line:#2A2B34; --chip:#262732; --track:#262732;
    --accent:#A69CF7; --accent-btn:#5646D6; --accent-soft:#26234A;
    --good:#5BC994; --good-soft:#15291F;
    --warn:#F0B45A; --warn-strong:#FFD69A; --warn-soft:#2E2414; --warn-bar:#D98A1E;
    --neutral-bar:#4A4C58; --bad:#F27A6E; --shadow:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1015; --card:#1A1B22; --ink:#F2F2F5; --muted:#A3A5B3; --line:#2A2B34; --chip:#262732; --track:#262732;
  --accent:#A69CF7; --accent-btn:#5646D6; --accent-soft:#26234A;
  --good:#5BC994; --good-soft:#15291F;
  --warn:#F0B45A; --warn-strong:#FFD69A; --warn-soft:#2E2414; --warn-bar:#D98A1E;
  --neutral-bar:#4A4C58; --bad:#F27A6E; --shadow:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
details summary{list-style:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.num,.amount,.big{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.stack{display:flex;flex-direction:column;gap:14px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.6px}
.top-r{display:flex;align-items:center;gap:6px}
.icon-btn{border:0;background:var(--chip);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.sync{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:44px;padding:0 6px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--neutral-bar)}
.dot.ok{background:var(--good)} .dot.pend{background:var(--warn-bar)} .dot.err{background:var(--bad)} .dot.demo{background:var(--accent)}

.seg{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted);padding:8px 14px;border-radius:999px;min-height:36px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.seg.filters{align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg.filters button{padding:8px 11px;font-size:13px;white-space:nowrap}

.card{background:var(--card);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:15px;font-weight:700}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.kpis{display:flex;gap:12px}
.kpi{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-size:17px;font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)} .acc{color:var(--accent)}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;display:flex}
.bar>div{height:100%;border-radius:999px}
.stackbar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;background:var(--track)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.warncard{background:var(--warn-soft);color:var(--warn-strong)}
.warncard .label,.warncard .muted{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13px;min-height:36px;white-space:nowrap}

.sec{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;min-height:36px;padding:0}

/* Rows */
.list{background:var(--card);border-radius:20px;padding:2px 14px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--track);color:var(--muted)}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-good{background:var(--good-soft);color:var(--good)} .t-accent{background:var(--accent-soft);color:var(--accent)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub b{font-weight:600;color:var(--warn)}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.row .am{font-size:15px;font-weight:700}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:12px 4px 6px;text-transform:capitalize}
.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:14px}

/* Period nav */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav-l{font-size:16px;font-weight:700;text-transform:capitalize}

/* Category bars */
.cbar{display:flex;flex-direction:column;gap:4px}
.cbar .h{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.cbar .h span:first-child{font-weight:600}

/* Trend */
.trend{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:4px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tbars{display:flex;align-items:flex-end;gap:2px;height:96px}
.tbars div{width:10px;border-radius:4px;min-height:2px}
.tcol span{font-size:11px;color:var(--muted)}
.tcol.on span{color:var(--ink);font-weight:700}

/* Común */
.hero{background:var(--accent-btn);color:#fff;border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.hero .who{display:flex;align-items:center;justify-content:space-between;gap:8px}
.avatar{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;font-size:13px;font-weight:600}
.avatar div{width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.hero .c{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;text-align:center}
.hero .c .v{font-size:34px;font-weight:800;letter-spacing:-1px}
.hero button{border:0;background:#fff;color:#3A2CA8;border-radius:16px;min-height:48px;font-weight:700;font-size:15px}
.hero .ghost{background:transparent;color:#fff;min-height:36px;font-size:13px}
.minis{display:flex;gap:10px}
.mini{flex:1;background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mini .v{font-size:20px;font-weight:800}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;min-height:48px}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.toggle label{font-size:14px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--accent-btn)}
.btn{border:0;background:var(--accent-btn);color:#fff;border-radius:16px;min-height:48px;font-weight:700;font-size:15px;padding:0 18px}
.btn.sec2{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.note b{color:var(--ink)}
.status{font-size:13px;font-weight:600}

/* Bottom nav */
nav.tab{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-around;align-items:center;z-index:5}
nav.tab button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;min-width:60px;min-height:48px;justify-content:center}
nav.tab button.on{color:var(--accent);font-weight:700}
nav.tab .add{width:56px;height:56px;border-radius:18px;background:var(--accent-btn);color:#fff;margin-top:-28px;box-shadow:0 6px 16px rgba(75,59,201,.35);min-width:56px}

/* Sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);gap:10px;max-width:560px;margin:0 auto}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.datebtn{position:relative;border-radius:12px;background:var(--chip);font-size:13px;font-weight:600;min-height:44px;min-width:64px;padding:0 12px;display:flex;align-items:center;justify-content:center}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.amount{text-align:center;font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1.05;padding-top:4px}
.amount.zero{color:var(--muted)}
.amt-sub{text-align:center;font-size:13px;color:var(--muted);margin-top:-4px}
.sh-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;padding:2px;-webkit-overflow-scrolling:touch}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{border:0;background:var(--card);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:600;min-height:68px;padding:6px 4px;text-align:center;line-height:1.15}
.cat.on{background:var(--accent-soft);outline:2px solid var(--accent);color:var(--ink)}
.cat svg{color:var(--ink)} .cat.on svg{color:var(--accent)}
.etq{display:flex;gap:8px}
.etq button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:999px;font-weight:600;font-size:13px;min-height:42px}
.etq button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.etq button.on.w{border-color:var(--warn-bar);background:var(--warn-soft);color:var(--warn-strong)}
.box{background:var(--card);border-radius:16px;padding:6px 14px;display:flex;flex-direction:column}
.box .line{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.box .line:last-child{border-bottom:0}
.box .line label,.box .line span{font-size:14px;font-weight:600}
.pill{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.pill button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.pill button.on{background:var(--card);color:var(--ink);font-weight:700}
.pct{width:72px;text-align:right;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:16px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{border:0;background:var(--card);border-radius:14px;font-size:24px;font-weight:600;height:50px}
.key:active{background:var(--chip)}
.save{border:0;background:var(--accent-btn);color:#fff;border-radius:18px;min-height:56px;font-size:17px;font-weight:700;width:100%}
.save:disabled{opacity:.4}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:14px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{display:flex}
#toast span{white-space:nowrap}
#toast button{border:0;background:transparent;color:var(--bg);font-weight:800;text-decoration:underline;min-height:36px}
@media (max-height:700px){ .key{height:44px} .amount{font-size:44px} .cat{min-height:60px} }

/* v0.2: escaneo, pendientes, patrimonio */
.scan{position:relative;display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;min-height:56px;cursor:pointer}
.scan input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.scan .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-btn);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scan b{display:block;font-size:14px}
.scan small{display:block;font-size:12px;color:var(--muted)}
.scanning{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--muted);font-size:14px}
.spin{width:40px;height:40px;border-radius:99px;border:4px solid var(--accent-soft);border-top-color:var(--accent-btn);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.pend{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pend .top{display:flex;align-items:center;gap:12px}
.pend .acts{display:flex;gap:8px}
.pend .acts button{flex:1;min-height:40px;border-radius:12px;border:0;font-weight:700;font-size:13px;background:var(--chip);color:var(--ink)}
.pend .acts .ok{background:var(--accent-btn);color:#fff}
.pend .acts .ok:disabled{opacity:.4}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--warn-soft);color:var(--warn)}
.pendbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--warn-soft);color:var(--warn-strong);border-radius:20px;padding:14px 16px;border:0;width:100%;text-align:left}
.pendbar b{font-size:15px}
.pendbar span{font-size:13px;font-weight:700;color:var(--warn)}
.bk{display:flex;flex-direction:column}
.bk .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.bk .r:last-child{border-bottom:0}
.bk .r .k{font-size:14px;font-weight:600}
.bk .r .k small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.bk .r .v{font-size:15px;font-weight:700;white-space:nowrap}
.minirow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px 16px;border:0;width:100%;text-align:left}
.minirow .v{font-size:20px;font-weight:800}
.help{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.pill.wrap{flex-wrap:wrap;border-radius:16px}
/* v0.3: fijos */
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px}
.cal button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;padding:0;min-width:0;border-radius:8px}
.cal .stk{width:70%;max-width:22px;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;background:var(--track);min-height:3px}
.cal .stk i{display:block}
.cal span{font-size:10.5px;color:var(--muted);line-height:1.1;text-align:center}
.cal button.on{background:var(--accent-soft)}
.cal button.on span{color:var(--ink);font-weight:800}
.chip2{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--track);color:var(--muted)}
.chip2.ok{background:var(--good-soft);color:var(--good)}
.chip2.rv{background:var(--warn-soft);color:var(--warn)}
.daytile{width:40px;height:40px;border-radius:12px;background:var(--track);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.daytile b{font-size:15px}
.daytile small{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
select.input{appearance:none;-webkit-appearance:none;background-image:none}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tab" id="nav" aria-label="Secciones"></nav>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script>
'use strict';

/* ================= Utilidades ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const curYM = () => todayStr().slice(0, 7);
function addMonths(s, n) {
  let [y, m] = s.split('-').map(Number); m += n;
  while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
  return `${y}-${pad(m)}`;
}
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

async function api(method, body, extra, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
  try {
    let res;
    if (method === 'GET') {
      const sep = cfg.api.includes('?') ? '&' : '?';
      res = await fetch(cfg.api + sep + 'token=' + encodeURIComponent(cfg.token) + (extra || ''), { signal: ctrl.signal });
    } else {
      res = await fetch(cfg.api, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: cfg.token, ...body }),
        signal: ctrl.signal
      });
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error === 'token' ? 'Token incorrecto' : (data.error || 'Error del servidor'));
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Tiempo de espera agotado');
    throw e;
  } finally { clearTimeout(t); }
}

    if (m.tipo === 'gasto' && m.comun) {
      const r = (m.reparto == null ? 50 : m.reparto) / 100, other = m.importe * (1 - r);
      o += m.perfil === 'maik' ? other : -other;
    } else if (m.tipo === 'liquidacion') {
      o += m.perfil === 'consu' ? -m.importe : m.importe;
    }
  }
  return Math.round(o * 100) / 100;
}
const sortDesc = (a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (b.creado || '').localeCompare(a.creado || ''));

/* ---------- Gastos fijos ---------- */
const FREQ = { mensual: { n: 'Mensual', k: 1 }, trimestral: { n: 'Trimestral', k: 3 }, semestral: { n: 'Semestral', k: 6 }, anual: { n: 'Anual', k: 12 } };
const freqK = f => (FREQ[f.frecuencia] || FREQ.mensual).k;
const vecesAno = f => 12 / freqK(f);
function venceEn(f, ym) {
  const [y, m] = ym.split('-').map(Number), k = freqK(f);
  if ((((m - Number(f.mes || 1)) % k) + k) % k !== 0) return null;
  return `${ym}-${pad(Math.min(Number(f.dia) || 1, new Date(y, m, 0).getDate()))}`;
}
function shareFijo(f, p) {
  if (!f.comun) return f.perfil === p ? f.importe : 0;
  const r = (f.reparto == null ? 50 : f.reparto) / 100;
  return f.perfil === p ? f.importe * r : f.importe * (1 - r);
}
const fijosDe = p => Store.fijos.filter(f => f.activo !== false && (f.perfil === p || f.comun));
const fijoMovId = (f, ym) => `fx-${f.id}-${ym}`;
function fijoEstado(f, ym) {
  const m = Store.movs.find(x => x.id === fijoMovId(f, ym));
  return m ? (isPend(m) ? 'revisar' : 'pagado') : null;
}
function generadoInicial(f) {
  const cur = curYM(), d = venceEn(f, cur);
  return d && d <= todayStr() ? cur : addMonths(cur, -1);
}
// Crea como "por revisar" cada pago fijo que ya ha vencido y aún no existe.
function generarFijos() {
  const hoy = todayStr(), cur = curYM();
  let n = 0;
  for (const f of Store.fijos.slice()) {
    if (f.activo === false || !(f.importe > 0)) continue;
    let g = /^\d{4}-\d{2}$/.test(f.generado) ? f.generado : generadoInicial(f);
    const g0 = f.generado;
    for (let m = addMonths(g, 1), i = 0; m <= cur && i < 24; m = addMonths(m, 1), i++) {
      const d = venceEn(f, m);
      if (d && d > hoy) break;
      if (d && !Store.movs.some(x => x.id === fijoMovId(f, m))) {
        const c = CAT_BY[f.categoria];
        Store.commit({ op: 'upsert', mov: { id: fijoMovId(f, m), fecha: d, perfil: f.perfil, tipo: 'gasto', importe: f.importe,
          categoria: f.categoria, etiqueta: f.categoria === 'inversion' ? '' : (c && c.e) || 'necesario', comun: !!f.comun,
          reparto: f.reparto == null ? 50 : f.reparto, nota: f.nombre, creado: new Date().toISOString(), estado: 'pendiente' } });
        n++;
      }
      g = m;
    }
    if (g !== g0) Store.commit({ op: 'upsertFijo', fijo: { ...f, generado: g } });
  }
  return n;
}

/* ---------- Inmuebles ---------- */
const USOS = { alquilado: 'Alquilado', vacio: 'Vacío', propia: 'Vivienda propia', construccion: 'En construcción' };
const inmDe = p => Store.inmuebles.filter(x => x.perfil === p);
const contratosDe = id => Store.contratos.filter(c => c.inmueble === id).sort((a, b) => b.inicio.localeCompare(a.inicio));
const conVigente = (c, hoy) => c.activo !== false && c.inicio <= hoy && (!c.fin || c.fin >= hoy);
function contratoActual(id) {
  const hoy = todayStr(), cs = contratosDe(id).filter(c => c.activo !== false);
  return cs.find(c => conVigente(c, hoy)) || cs.filter(c => c.inicio > hoy).sort((a, b) => a.inicio.localeCompare(b.inicio))[0] || null;
}
function valorInm(x) { const v = x.valor_actual != null ? x.valor_actual : x.compra_precio; return Number(v) || 0; }
function netoInm(x) { return (valorInm(x) - (Number(x.hipoteca_pendiente) || 0)) * (Number(x.pct) || 100) / 100; }
const costeInm = x => (Number(x.compra_precio) || 0) + (Number(x.compra_gastos) || 0);
function inmAnio(id, y) {
  const ms = Store.movs.filter(m => m.inmueble === id && !isPend(m) && m.fecha && m.fecha.slice(0, 4) === String(y));
  const ing = sum(ms.filter(m => m.tipo === 'ingreso').map(m => m.importe)), gas = sum(ms.filter(m => m.tipo === 'gasto').map(m => m.importe));
  return { ing, gas, neto: ing - gas, n: ms.length };
}
function proxRevision(c) {
  if (!c || !c.inicio) return null;
  const hoy = todayStr(), [y, m, d] = c.inicio.split('-');
  for (let yy = Math.max(Number(y) + 1, Number(hoy.slice(0, 4))); yy <= Number(hoy.slice(0, 4)) + 1; yy++) {
    const r = `${yy}-${m}-${d}`;
    if (r > hoy && (!c.fin || r <= c.fin)) return r;
  }
  return null;
}
function estadoInm(x) {
  const c = contratoActual(x.id), hoy = todayStr();
  if (c && conVigente(c, hoy)) return { t: 'Alquilado', cls: 'ok', c };
  if (c) return { t: 'Empieza ' + fechaCorta(c.inicio), cls: 'rv', c };
  if (x.uso === 'alquilado') return { t: 'Sin inquilino', cls: 'rv', c: null };
  return { t: USOS[x.uso] || 'Vacío', cls: '', c: null };
}
const fechaCorta = d => { const t = parseDate(d); return `${t.getDate()} ${MESES_C[t.getMonth()].toLowerCase()}${t.getFullYear() !== new Date().getFullYear() ? ' ' + t.getFullYear() : ''}`; };

/* Cobros del alquiler: cada mes se crea el ingreso "por revisar", igual que los gastos fijos. */
const cobroMovId = (c, ym) => `ct-${c.id}-${ym}`;
function cobroVence(c, ym) {
  if (!c.inicio || ym < c.inicio.slice(0, 7) || (c.fin && ym > c.fin.slice(0, 7))) return null;
  const [y, m] = ym.split('-').map(Number);
  const d = `${ym}-${pad(Math.min(Number(c.dia) || 1, new Date(y, m, 0).getDate()))}`;
  return d < c.inicio ? c.inicio : d;
}
function generadoInicialCon(c) {
  const ini = c.inicio ? c.inicio.slice(0, 7) : curYM();
  return addMonths(ini > curYM() ? ini : curYM(), -1);
}
function generarCobros() {
  const hoy = todayStr(), cur = curYM();
  let n = 0;
  for (const c of Store.contratos.slice()) {
    const x = Store.inmuebles.find(i => i.id === c.inmueble);
    if (!x || c.activo === false || !(c.renta > 0) || !c.inicio) continue;
    let g = /^\d{4}-\d{2}$/.test(c.generado) ? c.generado : generadoInicialCon(c);
    const g0 = c.generado;
    for (let m = addMonths(g, 1), i = 0; m <= cur && i < 24; m = addMonths(m, 1), i++) {
      const d = cobroVence(c, m);
      if (!d) { if (c.fin && m > c.fin.slice(0, 7)) break; g = m; continue; }
      if (d > hoy) break;
      if (!Store.movs.some(z => z.id === cobroMovId(c, m))) {
        Store.commit({ op: 'upsert', mov: { id: cobroMovId(c, m), fecha: d, perfil: x.perfil, tipo: 'ingreso', importe: c.renta,
          categoria: 'alquiler', etiqueta: '', comun: false, reparto: 50, nota: 'Alquiler · ' + x.nombre, creado: new Date().toISOString(),
          estado: 'pendiente', inmueble: x.id } });
        n++;
      }
      g = m;
    }
    if (g !== g0) Store.commit({ op: 'upsertCon', con: { ...c, generado: g } });
  }
  return n;
}

function inmCard(x) {
  const e = estadoInm(x), y = new Date().getFullYear(), a = inmAnio(x.id, y), coste = costeInm(x);
  const bruta = e.c && conVigente(e.c, todayStr()) && coste > 0 ? e.c.renta * 12 / coste : null;
  return `<button class="row" data-act="verinm" data-arg="${esc(x.id)}" style="align-items:flex-start">
    <div class="tile t-accent">${icon('home', 20)}</div>

  const totalMes = sum(mes.map(x => shareFijo(x.f, p)));
  const prox = [];
  for (let i = 0; i < 2; i++) { const m = addMonths(cur, i); fs.forEach(f => { const d = venceEn(f, m); if (d && d >= hoy) prox.push({ f, d }); }); }

/* ================= Escanear tickets ================= */
function resizeImage(file, max) {
  max = max || 2200;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL('image/jpeg', 0.82).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function fileBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve({ data: String(fr.result).split(',')[1], mime: file.type || 'application/pdf' });
    fr.onerror = () => reject(new Error('No se pudo leer el archivo'));
    fr.readAsDataURL(file);
  });
}
function facturaBox(f) {
  const x = f.factura || {};
  const det = [x.proveedor, x.nif, x.numero ? 'nº ' + x.numero : ''].filter(Boolean).map(esc).join(' · ');
  const imp = [x.base != null ? 'base ' + eur(x.base) : '', x.iva != null ? 'IVA ' + eur(x.iva) + (x.iva_pct != null ? ' (' + num(x.iva_pct, 0) + ' %)' : '') : '', x.irpf ? 'IRPF ' + eur(x.irpf) : ''].filter(Boolean).join(' · ');
  return `<div class="box" style="padding:12px 14px;gap:4px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:14px">Factura guardada</b><a class="link" href="${esc(f.adjunto)}" target="_blank" rel="noopener">Ver archivo</a></div>
    ${det ? `<div class="small">${det}</div>` : ''}${imp ? `<div class="small muted">${imp}</div>` : ''}</div>`;
}
async function handleScan(file, esFactura) {
  if (Store.isDemo()) { toast('Para leer tickets y facturas, conecta tu hoja en Ajustes'); return; }
  const perfil = F.perfil;
  document.querySelector('.sheet').innerHTML = `<div class="sh-top"><span></span></div><div class="scanning"><div class="spin" aria-hidden="true"></div><div><b style="color:var(--ink);font-size:16px">${esFactura ? 'Leyendo la factura…' : 'Leyendo la imagen…'}</b><br>${esFactura ? 'Se guardará en tu Drive, en la carpeta del trimestre.' : 'Suele tardar entre 5 y 15 segundos.'}</div></div>`;
  try {
    const pdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
    if (pdf && file.size > 9e6) throw new Error('El PDF pesa demasiado (máx. 9 MB)');
    const img = pdf ? await fileBase64(file) : await resizeImage(file, esFactura ? 2600 : 2200);
    if (pdf) img.mime = 'application/pdf';
    const r = await api('POST', { action: 'scan', image: img.data, mime: img.mime, factura: !!esFactura, perfil }, null, 120000);
    const items = r.items || [];
    if (!items.length) { toast('No he encontrado importes en la imagen'); renderSheet(); return; }
    const hoy = todayStr(), ahora = new Date().toISOString();
    items.forEach(it => {
      const ingreso = it.tipo === 'ingreso';
      let cat = it.categoria || '';
      if (ingreso && !CATS_ING.some(c => c.id === cat)) cat = 'otros_ing';
      if (!ingreso && CATS_ING.some(c => c.id === cat)) cat = '';
      Store.commit({ op: 'upsert', mov: {
        id: uid(), fecha: it.fecha && it.fecha <= hoy ? it.fecha : hoy, perfil, tipo: ingreso ? 'ingreso' : 'gasto',
        importe: it.importe, categoria: cat, etiqueta: ingreso || cat === 'inversion' ? '' : (it.etiqueta || (CAT_BY[cat] ? CAT_BY[cat].e : '') || ''),
        comun: false, reparto: 50, nota: it.comercio || '', creado: ahora, estado: 'pendiente', adjunto: it.adjunto || '', factura: it.factura || null } });
    });
    closeSheet(); UI.view = 'pendientes'; render(); window.scrollTo(0, 0);
    toast(`${items.length} leído${items.length > 1 ? 's' : ''}. Revísalo${items.length > 1 ? 's' : ''}.`);
  } catch (e) {
    toast('No se pudo leer: ' + e.message);
    if (F) renderSheet();
  }
}

let PF = null;
function parseDec(v) {
  if (v == null) return null;
  let t = String(v).trim().replace(/\s|€/g, '');
  if (!t) return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const n = Number(t);
  return isFinite(n) ? n : null;
}
// Importes en euros: "150.000" son 150 mil (punto de miles), "1.234,5" y "1234.5" también valen.
const parseMoney = v => { const t = String(v == null ? '' : v).trim().replace(/\s|€/g, ''); return /^\d{1,3}(\.\d{3})+$/.test(t) ? Number(t.replace(/\./g, '')) : parseDec(t); };
const decStr = n => (n == null || n === '' ? '' : String(n).replace('.', ','));
function openPos(x, tipo) {

  const f = (id, label, val, attrs) => `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" value="${esc(val)}" ${attrs || ''}></div>`;

        : PF.editing && PF.orig.precio_error ? `<p class="help" style="color:var(--bad)"><b>Sin precio:</b> ${esc(PF.orig.precio_error)}</p>` : ''}`;

}
function savePos() {
  readPF();
  let pos;
  if (PF.tipo === 'ahorro') {
    const imp = parseDec(PF.importe);
    if (imp == null) { toast('Pon el importe'); return; }
    pos = { id: PF.id || uid(), perfil: PF.perfil, nombre: PF.nombre || 'Ahorro', ticker: '', tipo: 'ahorro', unidades: 1, coste: imp, plataforma: PF.plataforma || '', precio_manual: imp, precio_eur: null };
  } else {
    const u = parseDec(PF.unidades);
    if (u == null || u <= 0) { toast('Indica cuántas unidades tienes'); return; }
    const ticker = (PF.ticker || '').toUpperCase().replace(/\s+/g, '');
    if (!PF.nombre && !ticker) { toast('Pon un nombre o un ticker'); return; }
    const keep = PF.orig && PF.orig.ticker === ticker && PF.orig.tipo === PF.tipo ? PF.orig.precio_eur : null;
    pos = { id: PF.id || uid(), perfil: PF.perfil, nombre: PF.nombre || ticker, ticker, tipo: PF.tipo, unidades: u,
      coste: parseDec(PF.coste), plataforma: PF.plataforma || '', precio_manual: parseDec(PF.precio_manual), precio_eur: keep };
  }
  const orig = PF.orig;
  Store.commit({ op: 'upsertPos', pos });
  closeSheet(); render();
  toast(Store.isDemo() || pos.precio_manual != null || pos.precio_eur != null ? 'Guardado' : 'Guardado. Buscando el precio…', orig
    ? () => { Store.commit({ op: 'upsertPos', pos: orig }); render(); }
    : () => { Store.commit({ op: 'deletePos', id: pos.id }); render(); });
}

/* ================= Toast ================= */
let toastT = null;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undo">Deshacer</button>' : ''}`;
  t.classList.add('show');
  if (undo) document.getElementById('undo').onclick = () => { undo(); t.classList.remove('show'); };
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 5000);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.arg, el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'comun') { ACT.comun(null, el); return; }
  if (el.id === 'scanfile' && F && el.files && el.files[0]) { handleScan(el.files[0], false); return; }
  if (el.id === 'scanfact' && F && el.files && el.files[0]) { handleScan(el.files[0], true); return; }
  if (el.id === 'f-comun' && FF) { readFF(); renderFijo(); return; }
  if (el.id === 'fecha' && F) { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) F.fecha = el.value; renderSheet(); return; }
  if (el.id === 'inm' && F) { F.inmueble = el.value; return; }
  if (el.id === 'rep' && F) { F.reparto = Math.max(0, Math.min(100, Number(el.value) || 0)); return; }
  const path = el.dataset.cfg;
  if (path) {
    const [k, p] = path.split('.');
    cfg[k][p] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (Number(el.value) || 0) : (el.value.trim() || DEFAULT_CFG[k][p]);
    saveCfg(); Store.touch();
    if (k === 'nombres') renderNav();
  }
});
document.addEventListener('input', e => {
  if (!F) return;
  if (e.target.id === 'nota') F.nota = e.target.value;
  if (e.target.id === 'rep') F.reparto = Math.max(0, Math.min(100, Number(e.target.value) || 0));
});
document.addEventListener('keydown', e => {
  if (!F || e.target.tagName === 'INPUT') return;
  if (/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if (e.key === ',' || e.key === '.') pressKey(',');
  else if (e.key === 'Backspace') pressKey('⌫');
  else if (e.key === 'Enter') saveSheet();
  else if (e.key === 'Escape') closeSheet();
});
window.addEventListener('online', () => Store.load().then(render));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !F && !Store.isDemo()) Store.load().then(render); });

function seedDemo() {
  let s = 20261015;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const between = (a, b) => Math.round((a + rnd() * (b - a)) * 100) / 100;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const out = []; let n = 0;
  const today = todayStr(), cur = curYM();
  const add = (ym, day, perfil, tipo, importe, categoria, etiqueta, nota, comun) => {
    const fecha = `${ym}-${pad(day)}`;
    if (fecha > today) return;
    out.push({ id: 'demo' + (n++), fecha, perfil, tipo, importe, categoria, etiqueta: etiqueta || '', comun: !!comun, reparto: 50, nota: nota || '', creado: fecha + 'T12:00:00Z' });
  };
  for (let k = 5; k >= 0; k--) {
    const ym = addMonths(cur, -k), last = k === 0;
    // Maik
    add(ym, 27, 'maik', 'ingreso', 2450, 'nomina', '', 'Nómina');
    add(ym, 3, 'maik', 'gasto', 39.9, 'deporte', 'necesario', 'Gimnasio');
    add(ym, 5, 'maik', 'gasto', 200, 'inversion', '', 'Aportación MSCI World');
    add(ym, 6, 'maik', 'gasto', 50, 'inversion', '', 'Compra Bitcoin');
    add(ym, 10, 'maik', 'gasto', 13.99, 'suscripciones', 'prescindible', 'Spotify');
    add(ym, 12, 'maik', 'gasto', 9.99, 'suscripciones', 'prescindible', 'iCloud');
    for (let i = 0; i < 2; i++) add(ym, 5 + i * 11, 'maik', 'gasto', between(35, 60), 'transporte', 'necesario', 'Gasolina');
    for (let i = 0; i < 4; i++) add(ym, 2 + i * 6, 'maik', 'gasto', between(1.8, 4.5), 'cafes', 'prescindible', '');
    for (let i = 0; i < 2; i++) add(ym, 8 + i * 9, 'maik', 'gasto', between(15, 45), 'ocio', 'prescindible', pick(['Cine', 'Pádel', 'Concierto']));
    if (rnd() > 0.4) add(ym, 19, 'maik', 'gasto', between(16, 28), 'delivery', 'capricho', pick(['Glovo', 'Just Eat']));
    // Consu
    const nf = 2 + (rnd() > 0.5 ? 1 : 0);
    for (let i = 0; i < nf; i++) add(ym, 6 + i * 9, 'consu', 'ingreso', between(550, 1250), 'factura', '', `Factura #${10 + (5 - k) * 3 + i}`);
    add(ym, 28, 'consu', 'gasto', 250, 'impuestos', 'necesario', 'Cuota autónomos');
    add(ym, 4, 'consu', 'gasto', 34.9, 'deporte', 'necesario', 'Yoga');
    add(ym, 9, 'consu', 'gasto', 7.99, 'suscripciones', 'prescindible', 'Netflix');
    const nd = last ? 6 : 3 + Math.floor(rnd() * 2);
    for (let i = 0; i < nd; i++) add(ym, 2 + Math.floor(i * (last ? 2.2 : 7)), 'consu', 'gasto', between(15, 29), 'delivery', 'capricho', pick(['Glovo', 'Just Eat', 'Uber Eats']));
    for (let i = 0; i < 1 + Math.floor(rnd() * 3); i++) add(ym, 7 + i * 8, 'consu', 'gasto', between(22, 65), 'ropa', 'prescindible', pick(['Zara', 'Mango', 'Vinted']));
    for (let i = 0; i < 7; i++) add(ym, 1 + i * 4, 'consu', 'gasto', between(1.6, 4.8), 'cafes', 'prescindible', '');
    if (rnd() > 0.3) add(ym, 16, 'consu', 'gasto', between(28, 55), 'cuidado', 'prescindible', 'Peluquería');
    add(ym, 13, 'consu', 'gasto', between(20, 40), 'transporte', 'necesario', 'Gasolina');
    if (rnd() > 0.6) add(ym, 21, 'consu', 'gasto', between(30, 60), 'salud', 'necesario', 'Farmacia');
    // Comunes
    add(ym, 1, 'maik', 'gasto', 900, 'vivienda', 'necesario', 'Alquiler', true);
    add(ym, 8, 'consu', 'gasto', between(85, 130), 'suministros', 'necesario', 'Luz y agua', true);
    add(ym, 11, 'maik', 'gasto', 45, 'suministros', 'necesario', 'Fibra', true);
    for (let i = 0; i < 5; i++) add(ym, 3 + i * 5, i % 2 ? 'maik' : 'consu', 'gasto', between(28, 92), 'super', 'necesario', pick(['Mercadona', 'Lidl', 'Consum']), true);
    for (let i = 0; i < 2; i++) add(ym, 9 + i * 10, i ? 'maik' : 'consu', 'gasto', between(38, 85), 'restaurantes', 'prescindible', pick(['La Taberna', 'Sushi', 'Pizzería']), true);
    if (!last) add(ym, 28, 'consu', 'liquidacion', 0, '', '', 'Liquidación');
  }
  // Ajusta las liquidaciones de meses pasados para que salden el saldo acumulado a final de mes
  const sorted = out.sort((a, b) => a.fecha.localeCompare(b.fecha));
  let o = 0;
  sorted.forEach(m => {
    if (m.tipo === 'gasto' && m.comun) o += m.perfil === 'maik' ? m.importe / 2 : -m.importe / 2;
    else if (m.tipo === 'liquidacion') { m.importe = Math.round(Math.abs(o) * 100) / 100; m.perfil = o > 0 ? 'consu' : 'maik'; o = 0; }
  });
  return sorted.filter(m => m.tipo !== 'liquidacion' || m.importe > 0);
}

  UI.recienEnlazado = location.href;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
})();
